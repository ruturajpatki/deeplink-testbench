name: Build Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            archive: deeplink-testbench-windows-x64.zip
          - os: macos-latest
            target: macos
            archive: deeplink-testbench-macos.zip
          - os: ubuntu-24.04
            target: linux
            archive: deeplink-testbench-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
          pkg-config --modversion gtk+-3.0
          pkg-config --cflags --libs gtk+-3.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable target platform
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows
        if: matrix.target == 'windows'
        working-directory: app
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.target == 'macos'
        working-directory: app
        run: flutter build macos --release

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: app
        run: flutter build linux --release

      - name: Package Windows
        if: matrix.target == 'windows'
        working-directory: app
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "../${{ matrix.archive }}"

      - name: Package macOS
        if: matrix.target == 'macos'
        working-directory: app
        run: ditto -c -k --sequesterRsrc --keepParent 'build/macos/Build/Products/Release/radx_deeplink.app' "../${{ matrix.archive }}"

      - name: Package Linux
        if: matrix.target == 'linux'
        working-directory: app
        run: tar -C build/linux/x64/release -czf "../${{ matrix.archive }}" bundle

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.archive }}
          generate_release_notes: false
          fail_on_unmatched_files: true
